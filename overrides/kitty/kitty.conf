# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Animated cursor follows text
include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# Include wallpaper colors
include colors-matugen.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
include $HOME/.config/kitty/custom.conf

# # Minimal tab bar
# tab_bar_minimal yes
# tab_title_template "{index}  {title}"
# active_tab_foreground #ffffff
# active_tab_background #0e1514
# inactive_tab_foreground #6f7978
# inactive_tab_background #0e1514
# transparent_background_colors #0e1514

# Sessions: save with F5, switch with F7
map f4 save_as_session --relocatable --use-foreground-process --match=session:. .
map f5 save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map f7>s goto_session --sort-by=alphabetical ~/.local/share/kitty/sessions
map f7>r goto_session -1
map f7>c close_session
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd

